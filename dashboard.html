<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Liderlik & Puanlar</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #090e1a; --card: #121929; --card-border: #1e293b; --card-inner: #0b1120;
			--text: #f8fafc; --muted: #94a3b8; --accent: #10b981; --accent-blue: #38bdf8;
			--rank-gold: #f59e0b; --btn-active: #10b981; --btn-bg: #1e293b;
		}
		* { box-sizing: border-box; }
		body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
		.container { max-width: 1200px; margin: 0 auto; }
		.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
		.grid-main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; margin-bottom: 20px; }
		@media(max-width: 900px) { .grid-main { grid-template-columns: 1fr; } }
		.panel { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; }
		
		/* Profile & Filter segment */
		.profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
		.rank-badge { background: var(--rank-gold); color: #000; font-weight: 700; padding: 6px 12px; border-radius: 8px; font-size: 1.2rem; }
		.btn-group { display: flex; background: var(--card-inner); border-radius: 8px; padding: 3px; gap: 4px; margin-bottom: 10px; }
		.btn-tab { flex: 1; background: transparent; border: none; color: var(--muted); padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
		.btn-tab.active { background: #334155; color: #fff; }
		.btn-tab.active-green { background: var(--btn-active); color: #000; }
		.score-display { text-align: center; margin: 24px 0; }
		.score-number { font-size: 3.5rem; font-weight: 700; color: var(--accent); line-height: 1; }
		.score-label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-top: 6px; letter-spacing: 0.05em; }
		
		/* Badges Section */
		.badges-wrap { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
		.badge-card { background: var(--card-inner); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; min-width: 120px; cursor: pointer; }
		
		/* Leaderboard List */
		.lb-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
		.lb-list { display: flex; flex-direction: column; gap: 6px; }
		.lb-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-inner); padding: 10px 14px; border-radius: 8px; border: 1px solid transparent; font-size: 0.9rem; }
		.lb-row.me { border-color: var(--accent); background: rgba(16, 185, 129, 0.06); }
		.lb-user { display: flex; align-items: center; gap: 10px; }
		.lb-rank { width: 28px; font-weight: 700; color: var(--muted); }
		.lb-pts { font-weight: 700; color: var(--accent); }
		
		/* Collapsible Details Drawer */
		.drawer-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--card-border); padding: 14px 20px; border-radius: 10px; color: var(--text); font-weight: 600; cursor: pointer; }
		.drawer-content { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
		.drawer-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
		.tx-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }
		.tx-head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
		.tx-pts { color: var(--accent); font-weight: 700; }
		.tx-meta { color: var(--muted); font-size: 0.78rem; margin-top: 10px; }
		.tag-box { background: var(--card-inner); border-left: 3px solid var(--accent-blue); padding: 8px 12px; margin: 8px 0; font-size: 0.85rem; color: #cbd5e1; border-radius: 0 6px 6px 0; }
	</style>
	<script>
		window.define = function(d, f) { const fn = typeof d === 'function' ? d : f; const e = {}; const r = fn ? fn(e, e) : null; window.SDK = (r && Object.keys(r).length) ? r : e; };
		window.define.amd = true;
	</script>
	<script src="lib/SDK.min.js"></script>
</head>
<body>
<div class="container">
	<div class="top-bar">
		<div>
			<h2 style="margin:0; font-size:1.4rem;">⚡ Puanlar</h2>
			<small style="color:var(--muted)">Liderlik Tablosu ve Detaylar</small>
		</div>
		<button class="btn-tab active" style="flex:none; padding:6px 12px;" onclick="loadData()">⟳ Yenile</button>
	</div>

	<div class="grid-main">
		<!-- LEFT: Profile, Filters, Badges -->
		<div class="panel">
			<div class="profile-head">
				<div class="rank-badge" id="myRank">#-</div>
				<div>
					<h3 id="myName" style="margin:0; font-size:1.15rem;">Kullanıcı</h3>
					<span style="color:var(--muted); font-size:0.8rem;" id="mySub">0p bugün</span>
				</div>
			</div>

			<div class="btn-group">
				<button class="btn-tab active-green" onclick="setScope(this, 'all')">Tüm şirket</button>
				<button class="btn-tab" onclick="setScope(this, 'team')">Ekip</button>
			</div>

			<div class="btn-group">
				<button class="btn-tab active" onclick="setTime(this, 'all')">Tüm zamanlar</button>
				<button class="btn-tab" onclick="setTime(this, 'today')">Bugün</button>
				<button class="btn-tab" onclick="setTime(this, '7d')">Son 7 gün</button>
				<button class="btn-tab" onclick="setTime(this, 'sprint')">Bu sprint</button>
			</div>

			<div class="score-display">
				<div class="score-number" id="myTotalPts">0</div>
				<div class="score-label" id="scoreScopeLabel">TÜM ŞİRKET · TÜM ZAMANLAR</div>
			</div>

			<div style="margin-top:20px;">
				<h4 style="margin:0 0 8px; font-size:0.85rem; color:var(--muted); text-transform:uppercase;">Rozetler</h4>
				<div class="badges-wrap" id="userBadges">
					<div class="badge-card">
						<div style="font-size:1.4rem;">🎯</div>
						<strong style="font-size:0.85rem; display:block; margin-top:4px;">İlk Adım</strong>
						<small style="color:var(--muted); font-size:0.75rem;">Puan kazanmaya başla</small>
					</div>
				</div>
			</div>
		</div>

		<!-- RIGHT: Leaderboard Ranking -->
		<div class="panel">
			<div class="lb-header">
				<span>SIRALAMA</span>
				<span id="lbTotalCount">0 kişi</span>
			</div>
			<div class="lb-list" id="lbList">
				<div style="color:var(--muted); text-align:center; padding:20px;">Yükleniyor...</div>
			</div>
		</div>
	</div>

	<!-- BOTTOM: Collapsible Details -->
	<button class="drawer-toggle" onclick="toggleDetails()">
		<span id="drawerTitle">Detayları göster</span>
		<span id="drawerArrow">▼</span>
	</button>

	<div class="drawer-content" id="drawerContent" hidden>
		<div class="drawer-tabs">
			<button class="btn-tab active" onclick="setTxTab(this, 'all')">Geçmiş</button>
			<button class="btn-tab" onclick="setTxTab(this, 'stats')">İstatistik</button>
			<button class="btn-tab" onclick="setTxTab(this, 'rejected')">Reddedilen</button>
			<button class="btn-tab" onclick="setTxTab(this, 'help')">Yardım</button>
		</div>

		<div id="txListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
	</div>
</div>

<script>
	const API_BASE = "https://test.humn.tr";
	let usersData = [], txData = [], currentUser = null;

	function toggleDetails() {
		const el = document.getElementById('drawerContent');
		const isOpen = !el.hidden;
		el.hidden = isOpen;
		document.getElementById('drawerTitle').innerText = isOpen ? "Detayları göster" : "Detayları gizle";
		document.getElementById('drawerArrow').innerText = isOpen ? "▼" : "▲";
	}

	function setScope(btn, scope) {
		btn.parentElement.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active-green'));
		btn.classList.add('active-green');
	}

	function setTime(btn, time) {
		btn.parentElement.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
		btn.classList.add('active');
		document.getElementById('scoreScopeLabel').innerText = `TÜM ŞİRKET · ${btn.innerText.toUpperCase()}`;
	}

	function setTxTab(btn, mode) {
		btn.parentElement.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
		btn.classList.add('active');
		renderTransactions(mode);
	}

	async function loadData() {
		try {
			const lbRes = await fetch(`${API_BASE}/api/leaderboard?pageSize=50`);
			const lbJson = await lbRes.json();
			usersData = lbJson.items || [];
			document.getElementById('lbTotalCount').innerText = `${lbJson.totalCount || usersData.length} kişi`;

			currentUser = usersData[0] || { userName: "Geliştirici", points: 0, medals: [] };
			document.getElementById('myName').innerText = currentUser.userName;
			document.getElementById('myTotalPts').innerText = currentUser.points;
			document.getElementById('myRank').innerText = `#1`;

			renderLeaderboard();
			renderBadges(currentUser.medals || []);

			const txRes = await fetch(`${API_BASE}/api/transactions?pageSize=20`);
			const txJson = await txRes.json();
			txData = txJson.items || [];
			renderTransactions('all');
		} catch (e) {
			console.error("Yükleme hatası:", e);
		}
	}

	function renderLeaderboard() {
		const medalsIcon = ["🥇", "🥈", "🥉"];
		document.getElementById('lbList').innerHTML = usersData.slice(0, 10).map((u, i) => `
			<div class="lb-row ${i === 0 ? 'me' : ''}">
				<div class="lb-user">
					<span class="lb-rank">${medalsIcon[i] || (i + 1)}</span>
					<div>
						<strong>${u.userName}</strong>
						${i === 0 ? '<small style="color:var(--accent); margin-left:4px;">SEN</small>' : ''}
					</div>
				</div>
				<span class="lb-pts">${u.points}p</span>
			</div>
		`).join('');
	}

	function renderBadges(medals) {
		const wrap = document.getElementById('userBadges');
		if (!medals.length) {
			wrap.innerHTML = `
				<div class="badge-card">
					<div style="font-size:1.4rem;">🎯</div>
					<strong style="font-size:0.85rem; display:block; margin-top:4px;">İlk Adım</strong>
					<small style="color:var(--muted); font-size:0.75rem;">Puan kazanmaya başla</small>
				</div>`;
			return;
		}
		wrap.innerHTML = medals.map(m => `
			<div class="badge-card">
				<div style="font-size:1.4rem;">🏆</div>
				<strong style="font-size:0.85rem; display:block; margin-top:4px;">${m.type}</strong>
				<small style="color:var(--muted); font-size:0.75rem;">${m.description || ''}</small>
			</div>
		`).join('');
	}

	function renderTransactions(filterMode) {
		const wrap = document.getElementById('txListContainer');
		let filtered = txData;
		if (filterMode === 'rejected') filtered = txData.filter(t => t.deltaPoints === 0);

		if (!filtered.length) {
			wrap.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">Kayıt bulunamadı.</div>';
			return;
		}

		wrap.innerHTML = filtered.map(t => {
			const isPos = t.deltaPoints > 0;
			return `
				<div class="tx-card">
					<div class="tx-head">
						<span class="tx-pts" style="color: ${isPos ? '#10b981' : (t.deltaPoints < 0 ? '#ef4444' : '#94a3b8')}">
							${isPos ? '+' : ''}${t.deltaPoints} ${t.type}
						</span>
					</div>
					<div>${t.description || ''}</div>
					${t.workItemId ? `<div class="tag-box">Task ID: #${t.workItemId}</div>` : ''}
					<div class="tx-meta">#${t.workItemId || t.id} · ${new Date(t.timestamp).toLocaleDateString('tr-TR')}</div>
				</div>
			`;
		}).join('');
	}

	if (window.SDK) {
		SDK.init({ applyTheme: true });
		SDK.ready().then(() => SDK.notifyLoadSucceeded());
	}

	loadData();
</script>
</body>
</html>
