<!-- Save as: dashboard.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puanlar & Liderlik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="lib/azure-devops-extension-sdk/SDK.min.js"></script>
    <style>
        :root{--bg:#090d16;--card:#101626;--sub:#161e33;--sub2:#1a233b;--border:#1e2942;--text:#f1f5f9;--muted:#8492a6;--green:#10b981;--purp:#8b5cf6;--gold:#fbbf24;--blue:#3b82f6;--red:#ef4444}
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:20px;line-height:1.4}
        .flex{display:flex}.col{flex-direction:column}.ac{align-items:center}.jb{justify-content:space-between}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media(max-width:1000px){.grid{grid-template-columns:1fr}}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
        .pill-box{background:var(--sub);border-radius:8px;padding:3px;display:flex;gap:3px}
        .pill-btn{flex:1;background:none;border:none;color:var(--muted);font:600 .75rem inherit;padding:6px 10px;border-radius:6px;cursor:pointer;transition:.15s}
        .pill-btn:hover{color:#fff}
        .pill-btn.active{background:var(--green);color:#064e3b;font-weight:700}
        .badge{font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
        .b-war{background:rgba(239,68,68,.15);color:#f87171}
        .b-com{background:rgba(99,102,241,.15);color:#a5b4fc}
        .badge-card{background:var(--sub);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.15s}
        .badge-card:hover{border-color:var(--blue);transform:translateY(-1px)}
        .row-item{background:var(--sub);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.82rem;cursor:pointer;transition:.15s}
        .row-item:hover{background:var(--sub2)}
        .row-item.me{background:rgba(139,92,246,.08);border-color:var(--purp)}
        .sen-tag{background:#4c1d95;color:#ddd6fe;font-size:.6rem;padding:1px 4px;border-radius:3px;font-weight:700;margin-left:4px}
        .details-bar{width:100%;background:var(--sub);border:none;color:#fff;padding:12px 18px;cursor:pointer;font:600 .85rem inherit;border-radius:14px}
        .log-box{background:var(--sub);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.8rem}
        .log-code{background:rgba(15,23,42,.6);border-left:2px solid var(--blue);padding:6px 10px;color:#93c5fd;font-family:monospace;font-size:.75rem;border-radius:4px}
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
        .stat-card{background:var(--sub);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
        .modal{position:fixed;inset:0;background:rgba(9,13,22,.85);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
        .modal[hidden]{display:none!important}
        .modal-body{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px}
        .modal-item{background:var(--sub);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:.8rem;margin-bottom:4px}
    </style>
</head>
<body>
    <div class="flex jb ac" style="margin-bottom:16px;">
        <div class="flex ac g8"><span style="color:#f59e0b;font-size:1.2rem;">⚡</span><div><h2 style="font-size:1.1rem;">Puanlar</h2><span style="font-size:.72rem;color:var(--muted)">2026 18.iterasyon</span></div></div>
        <button id="btnRefresh" title="Yenile" style="background:var(--sub);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer">↻</button>
    </div>

    <div class="grid" style="margin-bottom:16px;">
        <!-- Left Column: User Profile -->
        <div class="card flex col g16">
            <div class="flex ac g12">
                <div id="uRank" style="background:var(--gold);color:#0f172a;font-weight:800;font-size:1rem;padding:6px 12px;border-radius:8px">#--</div>
                <div><h3 id="uName" style="font-size:1.1rem">Kullanıcı</h3><span id="uSub" style="font-size:.75rem;color:var(--muted)">Bugün 0p · 0.0h</span></div>
            </div>

            <!-- Scope Filter Buttons -->
            <div class="pill-box" id="scopeButtons">
                <button class="pill-btn active" data-scope="Tüm Şirket">Tüm şirket</button>
                <button class="pill-btn" data-scope="Ekip">Ekip</button>
            </div>

            <!-- Timeframe Filter Buttons -->
            <div class="pill-box" id="timeframeButtons">
                <button class="pill-btn active" data-tf="all">Tüm zamanlar</button>
                <button class="pill-btn" data-tf="today">Bugün</button>
                <button class="pill-btn" data-tf="week">Son 7 gün</button>
                <button class="pill-btn" data-tf="sprint">Bu sprint</button>
            </div>

            <div style="text-align:center">
                <div id="uPoints" style="font-size:3rem;font-weight:800;color:var(--green);line-height:1">0</div>
                <div id="uScopeLabel" style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px">Tüm Şirket · Tüm Zamanlar</div>
            </div>

            <div class="flex jb ac" style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 14px;color:var(--green);font-size:.78rem;font-weight:600">
                <span>2026 18.iterasyon</span><span id="uSprintPts">0p · #-</span>
            </div>

            <div>
                <span style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:8px">Rozetler</span>
                <div id="badgeGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px"></div>
            </div>
        </div>

        <!-- Right Column: Leaderboard -->
        <div class="card flex col">
            <div class="flex jb ac" style="margin-bottom:12px">
                <span style="font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase">Sıralama</span>
                <div class="flex g8 ac">
                    <span id="lbFilterTag" style="background:rgba(16,185,129,.1);color:var(--green);border-radius:99px;padding:3px 10px;font-size:.68rem;font-weight:600">Tüm şirket - Tüm zamanlar</span>
                    <span id="totalUsers" style="background:var(--sub);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:.68rem">0 kişi</span>
                </div>
            </div>
            <div id="rankList" class="flex col g4"></div>
        </div>
    </div>

    <!-- Collapsible Details / History Panel -->
    <div style="border:1px solid var(--border);border-radius:14px;background:var(--card);overflow:hidden">
        <button id="btnToggleDetails" class="details-bar flex jb ac"><span id="txtToggle">Detayları göster</span><span id="arrToggle">▼</span></button>
        <div id="secDetails" style="padding:16px;display:flex;flex-direction:column;gap:12px" hidden>
            <!-- Detail Sub-tabs -->
            <div class="flex g8" id="detailTabs">
                <button class="pill-btn active" data-tab="history" style="background:var(--sub);border:1px solid var(--green);color:#fff;flex:1">Geçmiş</button>
                <button class="pill-btn" data-tab="stats" style="background:var(--sub);border:1px solid var(--border);flex:1">İstatistik</button>
                <button class="pill-btn" data-tab="rejected" style="background:var(--sub);border:1px solid var(--border);flex:1">Reddedilen</button>
                <button class="pill-btn" data-tab="help" style="background:var(--sub);border:1px solid var(--border);flex:1">Yardım</button>
            </div>
            <div id="detailViewWrap" class="flex col g8"></div>
        </div>
    </div>

    <!-- Modal Trophy Cabinet -->
    <div id="userModal" class="modal" hidden onclick="if(event.target===this)closeModal()">
        <div class="modal-body">
            <div class="flex jb ac" style="border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px">
                <div><h3 id="mName" style="font-size:1.05rem"></h3><span id="mPts" style="font-size:.75rem;color:var(--green);font-weight:700"></span></div>
                <button onclick="closeModal()" style="background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer">&times;</button>
            </div>
            <div id="mContent"></div>
        </div>
    </div>

    <script>
    (function(){
        if(typeof SDK!=="undefined"){SDK.init({applyTheme:true});SDK.ready().then(()=>SDK.notifyLoadSucceeded());}

        const R={mil:['Albay','Tuğgeneral','Tümgeneral','Orgeneral','Efsane'],acad:['Öğretim Görevlisi','Doktor','Doçent Doktor','Profesör Doktor','Ordinaryüs Profesör'],v:['v3','v6','v8','v10','v12']};
        const I={mil:'⚔️',acad:'🎓',v:'🏆',w:'🗡️',c:'💬',def:'🎯'};
        const getIcon=t=>!t?I.def:R.mil.includes(t)?I.mil:R.acad.includes(t)?I.acad:R.v.includes(t)?I.v:t.includes('Warrior')?I.w:t.includes('Commenter')?I.c:I.def;
        const mask=n=>n.split(' ').map(p=>p.length<=1?p:p[0]+'***').join(' ');

        let users=[], allTransactions=[], me=null, currentScope="Tüm Şirket", currentTimeframe="all", activeDetailTab="history";

        function getBestMedals(list=[]){
            let r=[];
            ['mil','acad','v'].forEach(k=>{
                let max=-1,m=null;
                list.forEach(x=>{let i=R[k].indexOf(x.type);if(i>max){max=i;m=x;}});
                if(m)r.push(m);
            });
            return r;
        }

        function getDailyCounts(list=[]){
            return list.reduce((a,m)=>{if(m.type==='Daily Warrior'||m.type==='Daily Commenter')a[m.type]=(a[m.type]||0)+1;return a;},{});
        }

        // ---------- Timeframe & Points Calculation ----------
        function updatePointsDisplay(){
            if(!me) return;
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const sevenDaysAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000);

            let pts = me.points;
            let tfLabel = "Tüm Zamanlar";

            const myTx = allTransactions.filter(t => t.userName === me.userName);

            if(currentTimeframe === "today"){
                pts = myTx.filter(t => new Date(t.timestamp).getTime() >= startOfToday).reduce((s, t) => s + (t.deltaPoints || 0), 0);
                tfLabel = "Bugün";
            } else if(currentTimeframe === "week"){
                pts = myTx.filter(t => new Date(t.timestamp).getTime() >= sevenDaysAgo).reduce((s, t) => s + (t.deltaPoints || 0), 0);
                tfLabel = "Son 7 Gün";
            } else if(currentTimeframe === "sprint"){
                pts = me.points; // Active sprint points
                tfLabel = "Bu Sprint";
            }

            document.getElementById('uPoints').innerText = pts;
            document.getElementById('uScopeLabel').innerText = `${currentScope} · ${tfLabel}`;
            document.getElementById('lbFilterTag').innerText = `${currentScope} - ${tfLabel}`;
        }

        // Wire Scope Buttons
        document.querySelectorAll('#scopeButtons .pill-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#scopeButtons .pill-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentScope = btn.dataset.scope;
                updatePointsDisplay();
            };
        });

        // Wire Timeframe Buttons
        document.querySelectorAll('#timeframeButtons .pill-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#timeframeButtons .pill-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTimeframe = btn.dataset.tf;
                updatePointsDisplay();
            };
        });

        // ---------- Leaderboard Loader ----------
        async function loadLb(){
            const res = await fetch('/api/leaderboard?page=1&pageSize=100');
            if(!res.ok) return;
            const d = await res.json();
            users = d.items || [];
            document.getElementById('totalUsers').innerText = `${d.totalCount || users.length} kişi`;
            if(!users.length) return;

            me = users[0];
            document.getElementById('uRank').innerText = `#1`;
            document.getElementById('uName').innerText = me.userName;
            document.getElementById('uSprintPts').innerText = `${me.points}p · #1`;

            // Calculate Today's Stats for header
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const todayPts = allTransactions.filter(t => t.userName === me.userName && new Date(t.timestamp).getTime() >= startOfToday).reduce((s, t) => s + (t.deltaPoints || 0), 0);
            document.getElementById('uSub').innerText = `Bugün ${todayPts}p · ${(todayPts * 0.125).toFixed(1)}h`;

            updatePointsDisplay();

            // Render Rozetler
            const best = getBestMedals(me.medals), daily = getDailyCounts(me.medals);
            let bHtml = best.map(m => `<div class="badge-card" onclick="openModal(${me.id})"><div style="font-size:1.3rem">${getIcon(m.type)}</div><strong style="font-size:.72rem;display:block;margin-top:4px">${m.type}</strong></div>`).join('');
            bHtml += Object.entries(daily).map(([t, c]) => `<div class="badge-card" onclick="openModal(${me.id})"><div style="font-size:1.3rem">${t.includes('Warrior')?I.w:I.c}</div><strong style="font-size:.72rem;display:block;margin-top:4px">${t} &times;${c}</strong></div>`).join('');
            document.getElementById('badgeGrid').innerHTML = bHtml || `<div class="badge-card" onclick="openModal(${me.id})"><div style="font-size:1.3rem">🎯</div><strong style="font-size:.72rem;display:block;margin-top:4px">İlk Adım</strong></div>`;

            // Render Right Leaderboard
            const top5 = users.slice(0, 5), bot5 = users.length > 10 ? users.slice(-5) : [];
            let lHtml = top5.map((u, i) => buildRow(u, i + 1, u.id === me.id)).join('');
            if(users.length > 5) lHtml += `<div style="text-align:center;color:var(--muted);font-weight:bold;letter-spacing:2px;padding:4px 0">···</div>`;
            if(bot5.length){
                lHtml += `<span style="font-size:.65rem;font-weight:700;color:var(--muted);margin:4px 0">Son 5</span>` + bot5.map((u, i) => buildRow(u, users.length - 5 + i + 1, u.id === me.id)).join('');
            }
            document.getElementById('rankList').innerHTML = lHtml;
        }

        function buildRow(u, rank, isMe){
            const rTxt = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
            const chips = (u.dailyBadges || []).map(b => `<span class="badge ${b.includes('Warrior')?'b-war':'b-com'}">${b.includes('Warrior')?'⚔️ Warrior':'💬 Commenter'}</span>`).join('');
            return `<div class="row-item flex jb ac ${isMe?'me':''}" onclick="openModal(${u.id})">
                <div class="flex ac g12"><span style="width:20px;text-align:center;font-weight:700;color:var(--muted)">${rTxt}</span>
                    <div class="flex col"><span style="font-weight:600">${isMe ? u.userName : mask(u.userName)}${isMe ? '<span class="sen-tag">SEN</span>' : ''}</span>
                    ${isMe ? '<span style="font-size:.62rem;color:#a78bfa">MÜDÜR · AlbarakaTech</span>' : ''}</div>
                </div>
                <div class="flex ac g8"><div class="flex col g4" style="align-items:flex-end">${chips}</div><span style="font-weight:700;color:var(--green);min-width:40px;text-align:right">${u.points}p</span></div>
            </div>`;
        }

        // ---------- Details Panel Tabs & Data Rendering ----------
        async function fetchTx(){
            const res = await fetch('/api/transactions?page=1&pageSize=100');
            if(!res.ok) return;
            const d = await res.json();
            allTransactions = d.items || [];
        }

        function renderDetailTab(){
            const wrap = document.getElementById('detailViewWrap');
            if(activeDetailTab === "history"){
                wrap.innerHTML = allTransactions.map(t => `
                    <div class="log-box">
                        <div class="flex ac g8"><span style="color:var(--green);font-weight:700">${t.deltaPoints > 0 ? '+' : ''}${t.deltaPoints}</span><strong>${t.type === 'Remaining Work Updated' ? 'Remaining Work azaldı (1s=1p, max 8/gün)' : 'Completed Work arttı (1s=1p, max 8/gün)'}</strong></div>
                        <span style="color:var(--muted)">${t.description || 'İşlem tamamlandı'}</span>
                        <div class="log-code">${t.type === 'Remaining Work Updated' ? '-1.0h RW' : '+1.0h CW'}</div>
                        <span style="font-size:.68rem;color:var(--muted)">#${t.workItemId || '0000000'} · ${new Date(t.timestamp).toLocaleDateString('tr-TR')}</span>
                    </div>`).join('') || '<p style="color:var(--muted);text-align:center;padding:12px;">Kayıt yok.</p>';
            } else if(activeDetailTab === "stats"){
                const commentPts = allTransactions.filter(t => t.type === 'Comment Added').reduce((s, t) => s + (t.deltaPoints || 0), 0);
                const cwPts = allTransactions.filter(t => t.type === 'Completed Work Updated').reduce((s, t) => s + (t.deltaPoints || 0), 0);
                const rwPts = allTransactions.filter(t => t.type === 'Remaining Work Updated').reduce((s, t) => s + (t.deltaPoints || 0), 0);
                wrap.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat-card"><span style="font-size:.7rem;color:var(--muted);text-transform:uppercase;">Toplam Puan</span><div style="font-size:1.4rem;font-weight:800;color:var(--green);">${me ? me.points : 0}</div></div>
                        <div class="stat-card"><span style="font-size:.7rem;color:var(--muted);text-transform:uppercase;">Yorum Puanları</span><div style="font-size:1.4rem;font-weight:800;color:var(--blue);">${commentPts}p</div></div>
                        <div class="stat-card"><span style="font-size:.7rem;color:var(--muted);text-transform:uppercase;">Completed Work</span><div style="font-size:1.4rem;font-weight:800;color:var(--purp);">${cwPts}p</div></div>
                        <div class="stat-card"><span style="font-size:.7rem;color:var(--muted);text-transform:uppercase;">Remaining Work</span><div style="font-size:1.4rem;font-weight:800;color:var(--gold);">${rwPts}p</div></div>
                        <div class="stat-card"><span style="font-size:.7rem;color:var(--muted);text-transform:uppercase;">Toplam Kayıt</span><div style="font-size:1.4rem;font-weight:800;color:#fff;">${allTransactions.length}</div></div>
                    </div>`;
            } else if(activeDetailTab === "rejected"){
                const rejected = allTransactions.filter(t => t.deltaPoints <= 0 || (t.description && (t.description.includes('disabled') || t.description.includes('revoking') || t.description.includes('no points'))));
                wrap.innerHTML = rejected.length ? rejected.map(t => `
                    <div class="log-box" style="border-color:rgba(239,68,68,.3);">
                        <div class="flex ac g8"><span style="color:var(--red);font-weight:700">${t.deltaPoints}p</span><strong style="color:#fca5a5;">${t.type}</strong></div>
                        <span style="color:var(--muted);">${t.description || 'Puan kriteri karşılanmadı.'}</span>
                        <span style="font-size:.68rem;color:var(--muted)">#${t.workItemId || '—'} · ${new Date(t.timestamp).toLocaleDateString('tr-TR')}</span>
                    </div>`).join('') : '<p style="color:var(--muted);text-align:center;padding:12px;">Reddedilen veya sıfır puanlı işlem yok.</p>';
            } else if(activeDetailTab === "help"){
                wrap.innerHTML = `
                    <div class="flex col g8" style="font-size:.8rem;color:var(--muted);">
                        <div class="log-box"><strong style="color:#fff;">⏱️ Completed Work</strong>Her 1 saatlik tamamlanan iş için +1p kazanılır (Maksimum 8p / gün).</div>
                        <div class="log-box"><strong style="color:#fff;">📉 Remaining Work</strong>Kalan iş saatini her 1 saat düşürdüğünüzde +1p kazanırsınız (Maksimum 8p / gün).</div>
                        <div class="log-box"><strong style="color:#fff;">💬 Anlamlı Yorum</strong>Göreve yazılan ilk anlamlı teknik yorum AI tarafından puanlanır (50 puana kadar).</div>
                        <div class="log-box"><strong style="color:#fff;">🎖️ Rütbe & Rozetler</strong>Günlük en çok puan toplayanlar Daily Warrior / Daily Commenter olur; ardışık günlerde askeri ve akademik rütbelere terfi ederler.</div>
                    </div>`;
            }
        }

        // Wire Details Sub-tabs
        document.querySelectorAll('#detailTabs .pill-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#detailTabs .pill-btn').forEach(b => {
                    b.classList.remove('active');
                    b.style.borderColor = "var(--border)";
                    b.style.color = "var(--muted)";
                });
                btn.classList.add('active');
                btn.style.borderColor = "var(--green)";
                btn.style.color = "#fff";
                activeDetailTab = btn.dataset.tab;
                renderDetailTab();
            };
        });

        // Details Accordion Toggle
        const btnToggle = document.getElementById('btnToggleDetails'), secDetails = document.getElementById('secDetails');
        btnToggle.onclick = async () => {
            const h = secDetails.hidden;
            secDetails.hidden = !h;
            document.getElementById('txtToggle').innerText = h ? 'Detayları gizle' : 'Detayları göster';
            document.getElementById('arrToggle').innerText = h ? '▲' : '▼';
            if(h){
                if(!allTransactions.length) await fetchTx();
                renderDetailTab();
            }
        };

        // Modal
        window.openModal = function(id){
            const u = users.find(x => x.id === id);
            if(!u) return;
            document.getElementById('mName').innerText = u.userName;
            document.getElementById('mPts').innerText = `${u.points} Toplam Puan`;
            const list = u.medals || [], daily = getDailyCounts(list);
            const segs = [{t:'⚔️ Askeri Rütbeler',k:'mil'},{t:'🎓 Akademik Unvanlar',k:'acad'},{t:'🏆 İstikrar Rozetleri',k:'v'}];
            let html = segs.map(s => {
                let items = list.filter(m => R[s.k].includes(m.type));
                return items.length ? `<div style="margin-bottom:12px"><span style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase">${s.t}</span>${items.map(m => `<div class="modal-item flex ac g8"><span>${getIcon(m.type)}</span><div><strong>${m.type}</strong><span style="display:block;font-size:.72rem;color:var(--muted)">${m.description||''}</span></div></div>`).join('')}</div>` : '';
            }).join('');
            if(Object.keys(daily).length){
                html += `<div style="margin-bottom:12px"><span style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase">📜 Günlük Zaferler</span>${Object.entries(daily).map(([t, c]) => `<div class="modal-item flex ac g8"><span>${t.includes('Warrior')?I.w:I.c}</span><strong>${t} &times;${c}</strong></div>`).join('')}</div>`;
            }
            document.getElementById('mContent').innerHTML = html || '<p style="color:var(--muted);text-align:center">Rozet bulunmuyor.</p>';
            document.getElementById('userModal').hidden = false;
        };

        window.closeModal = () => document.getElementById('userModal').hidden = true;
        document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

        // Refresh Button
        document.getElementById('btnRefresh').onclick = async () => {
            await fetchTx();
            await loadLb();
            if(!secDetails.hidden) renderDetailTab();
        };

        // Initial Load
        fetchTx().then(loadLb);
    })();
    </script>
</body>
</html>
