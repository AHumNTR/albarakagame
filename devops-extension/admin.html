<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
	:root { --bg: #0d1117; --card: #161b22; --card-2: #1c2129; --border: #2a303c; --text: #e6edf3; --muted: #8b949e; --accent: #8b7cf6; --accent-h: #a599ff; --green: #3fb950; --red: #f85149; }
	* { box-sizing: border-box; }
	body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
	.wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 60px; }
	h1 { font-size: 1.25rem; margin: 0 0 4px; }
	.sub { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
	.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
	.card h2 { font-size: .95rem; margin: 0 0 14px; }
	label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
	input, textarea { width: 100%; background: var(--card-2); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 7px; font-family: inherit; font-size: .88rem; margin-bottom: 14px; }
	textarea { resize: vertical; }
	.btn { background: var(--accent); border: none; color: #fff; padding: 9px 18px; border-radius: 7px; font-weight: 600; cursor: pointer; font-size: .85rem; }
	.btn:hover { background: var(--accent-h); }
	.btn:disabled { opacity: .5; cursor: not-allowed; }
	#testRes { margin-top: 14px; font-weight: 700; font-size: .9rem; }
	.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
	.toggle-row:last-child { border-bottom: none; }
	.switch { position: relative; width: 42px; height: 22px; }
	.switch input { position: absolute; inset: 0; appearance: none; background: var(--border); border-radius: 99px; cursor: pointer; margin: 0; }
	.switch input:checked { background: var(--accent); }
	.switch input::before { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; }
	.switch input:checked::before { transform: translateX(20px); }
	#setStatus { color: var(--muted); font-size: .8rem; margin-top: 10px; height: 1em; }
</style>
</head>
<body>
<div class="wrap">
	<h1>🔐 Admin Giriş</h1>
	<div class="sub">Puanlama kurallarını test et ve aç/kapat.</div>

	<div class="card">
		<h2>Yorum Test Aracı</h2>
		<label for="testTitle">Görev başlığı</label>
		<input id="testTitle" value="Veritabanı şema güncelleme" placeholder="Başlık">
		<label for="testComment">Geliştirici yorumu</label>
		<textarea id="testComment" rows="3" placeholder="Yorum">Eski transaction tablosu revize edildi.</textarea>
		<button class="btn" id="testBtn" onclick="runTester()">Değerlendir</button>
		<div id="testRes" hidden></div>
	</div>

	<div class="card">
		<h2>Puanlama Kuralları</h2>
		<div id="togglesList"><div style="color:var(--muted); font-size:.85rem;">Yükleniyor…</div></div>
		<p id="setStatus"></p>
	</div>
</div>

<script>
const API_BASE = "https://test.humn.tr";

const TOGGLES = [
	{ k: 'commentsEnabled', l: 'Yorum puanları' },
	{ k: 'completedWorkEnabled', l: 'Tamamlanan iş puanları' },
	{ k: 'remainingWorkEnabled', l: 'Kalan iş puanları' },
	{ k: 'stateChangedEnabled', l: 'Kapanış puanları' },
	{ k: 'iterationChangedEnabled', l: 'İterasyon düzeltmesi' }
];

async function runTester() {
	const btn = document.getElementById('testBtn');
	btn.disabled = true;
	try {
		const res = await fetch(`${API_BASE}/api/test-score`, {
			method: 'POST', headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ title: document.getElementById('testTitle').value, comment: document.getElementById('testComment').value })
		});
		const d = await res.json();
		const box = document.getElementById('testRes');
		box.hidden = false;
		box.style.color = d.passed ? 'var(--green)' : 'var(--red)';
		box.innerText = `${d.passed ? '✅ Geçti' : '❌ Geçemedi'} — Skor: ${d.score}/100`;
	} finally {
		btn.disabled = false;
	}
}

async function initSettings() {
	try {
		const res = await fetch(`${API_BASE}/api/settings`);
		const data = await res.json();
		document.getElementById('togglesList').innerHTML = TOGGLES.map(t => `
			<div class="toggle-row"><span>${t.l}</span>
				<label class="switch"><input type="checkbox" id="tog-${t.k}" ${data[t.k] ? 'checked' : ''} onchange="saveSettings()"></label>
			</div>`).join('');
	} catch (e) {
		document.getElementById('togglesList').innerHTML = '<div style="color:var(--red); font-size:.85rem;">Ayarlar yüklenemedi.</div>';
	}
}

async function saveSettings() {
	const payload = {};
	TOGGLES.forEach(t => payload[t.k] = document.getElementById(`tog-${t.k}`).checked);
	await fetch(`${API_BASE}/api/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
	document.getElementById('setStatus').innerText = 'Ayarlar kaydedildi.';
	setTimeout(() => document.getElementById('setStatus').innerText = '', 2000);
}

initSettings();
</script>
</body>
</html>
